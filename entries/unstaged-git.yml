id: unstaged-git
language: en
word: "unstaged"
pronunciation: /ˌʌnˈsteɪdʒd/
part_of_speech: adjective
meaning: "未暂存的"
context: "工作树中的更改尚未加入 Git 索引。"
example: "Inspect the remaining unstaged changes."
notes: |-
  Source: schedulers/daily-1am-issue-investigation.md.

  来源: Merriam-Webster Dictionary: un-。https://www.merriam-webster.com/dictionary/un-
  来源: Pro Git: Recording Changes to the Repository。https://git-scm.com/book/en/v2/Git-Basics-Recording-Changes-to-the-Repository
word_formation: "un- + staged。un- 在这里否定已暂存状态；unstaged 说的是更改尚未暂存，不等于文件未被 Git 跟踪。"
mnemonic: "staged 表示更改已进入 Git 索引，unstaged 表示更改未进入索引；未暂存不等于未跟踪。"
