  来源: MDN: Callback function。https://developer.mozilla.org/en-US/docs/Glossary/Callback_function
word_formation: "a- + synchronous。a- 在这里表示否定；asynchronous 表示异步，不要求调用方按同步方式等待完成，不等于自动并行或完全没有顺序约束。"
