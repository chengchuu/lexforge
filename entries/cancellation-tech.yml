id: cancellation-tech
language: en
word: "cancellation"
pronunciation: /ˌkænsəˈleɪʃn/
part_of_speech: noun
meaning: "取消"
context: "使正在进行或等待执行的操作停止继续。"
example: "Preserve errors caused by external cancellation."
code_example: |-
  package main

  import (
      "context"
      "fmt"
  )

  func main() {
      ctx, cancel := context.WithCancel(context.Background())
      cancel()
      <-ctx.Done()
      fmt.Println(ctx.Err()) // context canceled
  }
notes: "Source: typescript/typescript-1.md."
audio: cancellation-tech.mp3
learning_priority: 2
tags:
