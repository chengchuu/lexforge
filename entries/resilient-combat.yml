etymology: "来自拉丁语 resilire (弹回、跳回) 的分词形式。英语从回弹的物理含义发展出遭遇困难后恢复的引申义。"
mnemonic: "图像助记 (非词源): 想象弹簧被压下后又弹回来，把 resilient 的重点放在受挫后恢复，而不只是硬或结实。"
