id: moushimasu
language: ja
word: "申します"
pronunciation: "もうします"
part_of_speech: verb
meaning: "叫作；自称（谦逊语）"
context: "「言う」的谦逊表达，在自我介绍中常表示自己叫某个名字。"
example: "森本と申します。"
notes: "此条保留礼貌屈折形式；姓名介绍结构「～と申します」另有独立条目。"
mnemonic: "用法助记：礼貌自报姓名时先想“姓名 + と申します”。叙述某人报上姓名这件事时，可用普通动词 名乗る。"
