id: deadline-go
language: en
word: "deadline"
pronunciation: "/ˈded.laɪn/"
part_of_speech: noun
meaning: "截止时间，指定操作最晚应结束的时刻"
example: "Set a deadline for the request."
code_example: |-
  package main

  import (
      "context"
      "fmt"
      "time"
  )

  func main() {
      deadline := time.Now().Add(-time.Second)
      ctx, cancel := context.WithDeadline(context.Background(), deadline)
      defer cancel()
      <-ctx.Done()
      fmt.Println(ctx.Err()) // context deadline exceeded
  }
notes: |-
  Source: Go Concurrency Patterns: Context. https://go.dev/blog/context

  Pronunciation source: Cambridge Dictionary — deadline (US, accessed 2026-11-19). https://dictionary.cambridge.org/pronunciation/english/deadline
mnemonic: "用法助记：看到 deadline，问“最迟几点结束”；看到 deadlock，问“谁在等谁”。一个关心时间界限，一个关心互相卡住的执行。"
learning_priority: 2
