id: conditional-rendering-react
language: en
word: "conditional rendering"
part_of_speech: noun phrase
meaning: "条件渲染，根据条件选择显示的内容"
example: "Conditional rendering shows the error only when the request fails."
code_example: |-
  import { useState } from 'react';

  export default function Demo() {
    const [show, setShow] = useState(false);
    return <>
      <button onClick={() => setShow(!show)}>{show ? 'Hide' : 'Show'} details</button>
      {show && <p>Platform 4</p>}
    </>;
  }
