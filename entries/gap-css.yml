id: gap-css
language: en
word: "gap"
pronunciation: "/ɡæp/"
part_of_speech: noun
meaning: "间距，用于设置布局中的行间距和列间距"
example: "Set a gap between the grid items."
code_example: |-
  <style>
    .sample { display: flex; gap: 16px; }
  </style>
  <div class="sample"><div>One</div><div>Two</div></div>
notes: |-
  Source: W3C — CSS Grid Layout Module Level 2. https://www.w3.org/TR/css-grid-2/

  Pronunciation source: Cambridge Dictionary — gap (US, accessed 2026-11-19). https://dictionary.cambridge.org/us/pronunciation/english/gap
learning_priority: 2
prerequisites:
  - layout-browser-rendering
audio: gap-css.mp3
