id: "integrity-general"
language: "en"
word: "integrity"
pronunciation: "/ɪnˈtɛɡrəti/"
part_of_speech: "noun"
meaning: "正直；诚信；坚持诚实和道德原则。"
example: "Sidon acts with integrity."
notes: |-
  这里采用人物品格的含义；数据完整性是另一个技术用法。

  学习主题: The Legend of Zelda: Tears of the Kingdom。
