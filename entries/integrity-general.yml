  配图：AI 生成的原创助记图，以店员没看见时主动补付零钱的情境联想诚信。
etymology: "与拉丁语 integritas (完整、健全) 和 integer (完整的) 有关；完整无损的含义也发展为品格健全、正直。这里是历史联系，不是把现代词拆成 in + tegrity。"
