id: reconciliation-react
language: en
word: "reconciliation"
part_of_speech: noun
meaning: "React 协调；比较界面描述并确定更新与状态保留。"
example: "A stable key helps reconciliation preserve component identity."
notes: |
  组件类型、树中位置和 key 共同影响身份。相同位置的同类型组件通常保留状态；改变 key 可触发重建。key 只需在相关兄弟节点间唯一，不是全局身份，也不自动保证最优更新。

  Source: Interviews/AprilSkill.md:633. Import record: guides/INTERVIEW_VOCABULARY_IMPORT_PLAN.md, item 36. Verified reference: React: Preserving and resetting state: https://react.dev/learn/preserving-and-resetting-state
learning_priority: 2
