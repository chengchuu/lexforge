id: tag-html
language: en
word: "tag"
pronunciation: "/tæɡ/"
part_of_speech: noun
meaning: "标签，HTML 源码中标记元素边界的语法"
example: "The tag uses the element's name."
code_example: |-
  <p>Orders close <em>today</em>.</p>
notes: |-
  例如 <p> 是开始标签，</p> 是结束标签。DOM 中表示这一段落的是 p 元素。

  Source: WHATWG HTML — Syntax. https://html.spec.whatwg.org/multipage/syntax.html

  Pronunciation source: Cambridge Dictionary — tag (US, accessed 2026-11-19). https://dictionary.cambridge.org/pronunciation/english/tag
learning_priority: 1
prerequisites:
  - markup-html
  - element-html
audio: tag-html.mp3
tags:
  - tech
  - frontend
  - html
  - noun
