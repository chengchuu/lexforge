id: progressive-enhancement-web
language: en
word: "progressive enhancement"
part_of_speech: noun phrase
meaning: "渐进增强；先提供基础可用能力，再为更强环境增加功能。"
example: "Progressive enhancement preserves a usable basic workflow."
notes: |
  先保证核心内容和操作可用，再通过能力检测添加增强。以可用性为起点，不以浏览器名称猜测能力。增强失败时基础路径仍应可用。

