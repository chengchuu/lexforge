id: number-typescript
language: en
word: "number"
pronunciation: "/ˈnʌm.bɚ/"
part_of_speech: keyword
meaning: "数值类型"
example: "The count variable has type number."
code_example: |-
  const whole: number = 4;
  const fraction: number = 1.5;
  console.log(whole + fraction); // 5.5
notes: |-
  使用小写 number 表示原始数值类型。Number 可指 JavaScript 的构造函数或包装对象类型。

  Source: TypeScript Handbook — Everyday Types. https://www.typescriptlang.org/docs/handbook/2/everyday-types.html

  Pronunciation source: Cambridge Dictionary — number (US, accessed 2026-11-19). https://dictionary.cambridge.org/pronunciation/english/number
learning_priority: 1
prerequisites:
  - type-tech
audio: number-typescript.mp3
tags:
