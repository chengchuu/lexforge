id: embedding-go
language: en
word: "embedding"
pronunciation: "/emˈbedɪŋ/"
part_of_speech: noun
meaning: "嵌入，在结构体中声明嵌入字段或在接口中包含其他接口"
example: "Embedding can promote methods from an embedded field."
code_example: |-
  package main

  import (
      "fmt"
  )

  type Point struct{ X, Y int }
  type Marker struct {
      Point // Embedded field.
      Label string
  }

  func main() {
      m := Marker{Point: Point{X: 4, Y: 2}, Label: "home"}
      fmt.Println(m.X) // 4; X is promoted from Point.
  }
notes: |-
  Source: Go specification — Types. https://go.dev/ref/spec#Types

  Pronunciation source: Collins Dictionary — embedding; American English. https://www.collinsdictionary.com/dictionary/english/embedding (accent: US; accessed 2026-11-22).
learning_priority: 2
prerequisites:
  - struct-go
audio: embedding-go.mp3
tags:
