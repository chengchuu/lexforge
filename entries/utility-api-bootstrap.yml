id: utility-api-bootstrap
language: en
word: "utility API"
part_of_speech: noun phrase
meaning: "工具类生成 API，使用 Sass 配置生成和扩展 Bootstrap 工具类的机制"
example: "Use the utility API to generate a project-specific class."
code_example: |-
  <!-- HTML -->
  <abbr class="cursor-help" title="Estimated time of arrival">ETA</abbr>

  <!-- SCSS (paste into lab.scss) -->
  @import "bootstrap/scss/functions";
  @import "bootstrap/scss/variables";
  @import "bootstrap/scss/maps";
  @import "bootstrap/scss/mixins";

  $utilities: (
    "cursor": (property: cursor, class: cursor, values: (help: help))
  );
  @import "bootstrap/scss/utilities/api";
notes: |-
  Source: Bootstrap 5.3 documentation — api. https://getbootstrap.com/docs/5.3/utilities/api/
learning_priority: 3
prerequisites:
  - utility-class-bootstrap
audio: utility-api-bootstrap.mp3
tags:
  - tech
  - frontend
  - bootstrap
  - phrase
