id: optional-parameter-typescript
language: en
word: "optional parameter"
part_of_speech: noun phrase
meaning: "可选形参，调用时可以省略的参数"
example: "The optional parameter lets callers supply a label."
code_example: |-
  function greet(name: string, title?: string) {
    return title === undefined ? name : title + " " + name;
  }
  console.log(greet("Ada"), greet("Ada", "Dr.")); // Ada Dr. Ada
notes: |-
  Source: TypeScript Handbook — More on Functions. https://www.typescriptlang.org/docs/handbook/2/functions.html
learning_priority: 2
