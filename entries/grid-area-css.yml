id: grid-area-css
language: en
word: "grid area"
part_of_speech: noun phrase
meaning: "网格区域，由网格线界定的矩形布局区域"
example: "The heading spans the grid area above the sidebar."
code_example: |-
  <style>
    .sample { display: grid; grid-template-areas: "title title" "main side"; }
    h2 { grid-area: title; } p { grid-area: main; } aside { grid-area: side; }
  </style>
  <section class="sample"><h2>Orders</h2><p>Today’s orders</p><aside>Filters</aside></section>
notes: |-
  Source: W3C — CSS Grid Layout Module Level 2. https://www.w3.org/TR/css-grid-2/
learning_priority: 2
prerequisites:
  - grid-container-css
audio: grid-area-css.mp3
tags:
