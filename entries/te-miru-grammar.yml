id: te-miru-grammar
language: ja
word: "〜てみる"
pronunciation: "〜てみる"
part_of_speech: phrase
meaning: "试着做……"
context: "接在动词て形后表示尝试做某事，不是字面上的看。"
example: "この料理を食べてみます。"
notes: "占位符「〜」不是需要朗读的文字。 学习来源: 《地獄少女》。\nMemory-aid source: Tofugu — 〜てみる. https://www.tofugu.com/japanese-grammar/temiru/"
word_formation: "动词て形 + みる；随前接动词的て形变化，也可出现 でみる，如 読んでみる。"
mnemonic: "用法助记: ～たい 侧重想做，～てみる 侧重试着做、看看如何。想做不等于已经尝试；想试试可以组合成 ～てみたい。"
