word: "baseline"
pronunciation: /ˈbeɪslaɪn/
part_of_speech: noun
meaning: "基准输出"
context: "保存的预期结果，用于比较新的编译或测试输出。"
example: "Review each changed baseline before accepting the update."
notes: "Source: typescript/typescript-64965.md.\nMemory-aid source: Merriam-Webster.com Dictionary — baseline. https://www.merriam-webster.com/dictionary/baseline\nMemory-aid source: Merriam-Webster.com Dictionary — benchmark. https://www.merriam-webster.com/dictionary/benchmark"
word_formation: "base + line: 用作比较基础的参照线。测试语境中引申为保存的预期输出，供新结果对照。"
mnemonic: "辨义助记: 在这两个词条里，baseline 问\"输出和保存的预期一样吗？\"，benchmark 问\"这个工作负载表现怎样？\"。两者都可作比较参照，不能在所有语境中硬分成互斥概念。"
