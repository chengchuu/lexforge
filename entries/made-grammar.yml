id: made-grammar
language: ja
word: "～まで"
pronunciation: "～まで"
part_of_speech: phrase
meaning: "直到……；到……为止"
context: "标记时间、地点或过程的终点，句中也可接在动词后。"
example: "駅まで歩きます。"
notes: |-
  学习来源: 《NARUTO -ナルト-》。

  Memory-aid source: Tofugu — Particle まで: Endpoint Marker. https://www.tofugu.com/japanese-grammar/particle-made/
word_formation: "地点名词 + まで 表示到该处为止，如 駅まで。动词普通形 + まで 表示持续到该事件，如 火影になるまで。"
