id: kaishain
language: ja
word: "会社員"
pronunciation: "かいしゃいん"
part_of_speech: noun
meaning: "公司职员"
context: "表示在公司工作的职员，常用于介绍职业；不指定哪家公司。"
example: "私は会社員です。"
notes: |-
  与「社員」区分：会社員侧重职业类别，社員侧重某家公司的成员身份。

  来源: 小学館《デジタル大辞泉》或《精選版 日本国語大辞典》: 会社員 (コトバンク)。https://kotobank.jp/word/会社員
  来源: 小学館《デジタル大辞泉》或《精選版 日本国語大辞典》: 員 (コトバンク)。https://kotobank.jp/word/員
word_formation: "会社 + 員 (いん)。員 表示某组织中的成员；会社員 指受雇于公司工作的职员，不特指管理层。"
mnemonic: "会社員侧重职业类别，社員侧重所属公司的成员身份；不要按两个完全不同的职业记忆。"
