id: hito-o-norowaba-ana-futatsu
language: ja
word: "人を呪わば穴二つ"
pronunciation: "ひとをのろわばあなふたつ"
part_of_speech: phrase
meaning: "害人终害己"
context: "以两个坑比喻害人也会害己，在所给《地獄少女》语境中作记忆短句。"
example: "人を呪わば穴二つ。"
notes: "「呪わば」是谚语中的文语条件形式，不是现代日语中「呪う」的一般条件形式。现代条件表达可见「呪えば」「呪ったら」，不能按文语形式机械类推。"
