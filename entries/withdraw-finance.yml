id: withdraw-finance
language: en
word: "withdraw"
pronunciation: "/wɪðˈdrɔ/"
part_of_speech: "verb"
meaning: "提取；将账户资金取出或转出。"
example: "Withdraw funds from the account."
notes: |-
  从 Withdrawable 提出的有独立学习价值的动词子项；截图并未出现独立 Withdraw 按钮。
