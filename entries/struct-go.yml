id: struct-go
language: en
word: "struct"
part_of_speech: keyword
meaning: "结构体，将具名字段组合为一个类型"
example: "A struct holds the host and port."
code_example: |-
  package main

  import (
      "fmt"
  )

  func main() {
      type user struct {
          Name   string
          Active bool
      }
      u := user{Name: "Ada", Active: true}
      fmt.Println(u.Name, u.Active) // Ada true
  }
notes: |-
  Source: Go specification — Types. https://go.dev/ref/spec#Types
learning_priority: 1
prerequisites:
  - type-tech
audio: struct-go.mp3
tags:
