id: sass-mixin-bootstrap
language: en
word: "Sass mixin"
part_of_speech: noun phrase
meaning: "Sass 混入，可以接收参数并复用一组样式规则的结构"
example: "Use a Sass mixin to generate breakpoint-specific styles."
code_example: |-
  <!-- HTML -->
  <p class="station-banner">Station guide</p>

  <!-- SCSS (paste into lab.scss) -->
  @import "bootstrap/scss/functions";
  @import "bootstrap/scss/variables";
  @import "bootstrap/scss/mixins";

  .station-banner {
    font-weight: normal;
    @include media-breakpoint-up(md) {
      font-weight: bold;
    }
  }
notes: |-
  Source: Bootstrap 5.3 documentation — sass. https://getbootstrap.com/docs/5.3/customize/sass/
learning_priority: 3
prerequisites:
  - sass-variable-bootstrap
audio: sass-mixin-bootstrap.mp3
tags:
  - tech
  - frontend
  - bootstrap
  - phrase
