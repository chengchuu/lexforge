id: moeagaru
language: ja
word: "燃え上がる"
pronunciation: "もえあがる"
part_of_speech: verb
meaning: "熊熊燃烧；燃烧起来"
context: "表示火焰旺盛地燃烧起来，也可描述情绪高涨。"
example: "炎が燃え上がります。"
notes: "自动词；命令形「燃え上がれ」出现在所给作品短句中。 学习来源: 《聖闘士星矢》。"
mnemonic: "用法助记：画面里火焰自己升起来，用 炎が燃え上がる。有人使某物燃烧时，用“对象 + を + 燃やす”，を 前面是被点燃的对象。"
