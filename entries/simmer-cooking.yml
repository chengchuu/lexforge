id: "simmer-cooking"
language: "en"
word: "simmer"
pronunciation: "/ˈsɪmər/"
part_of_speech: "verb"
meaning: "小火慢煮；使液体保持轻微沸腾。"
example: "Simmer the fruit over low heat."
notes: |-
  simmered 是烹饪语境中的过去分词或形容词形式；这里以动词原形学习。

  来源组合或标题: Simmered Fruit。

  学习主题: The Legend of Zelda: Tears of the Kingdom。
  Source: Prompt/20261104-lexforge.md. Source form: simmered.

  Memory-aid source: Merriam-Webster.com Dictionary — simmer. https://www.merriam-webster.com/dictionary/simmer
