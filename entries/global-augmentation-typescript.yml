id: global-augmentation-typescript
language: en
word: "global augmentation"
part_of_speech: "noun phrase"
meaning: "全局扩充；在声明中补充已有全局类型或接口的信息。"
example: "The module contains a global augmentation."
code_example: |-
  export {};
  declare global {
    var exampleBuildId: string;
  }
  globalThis.exampleBuildId = "local";
  console.log(globalThis.exampleBuildId.toUpperCase());
  // The declaration describes the type. The assignment creates the runtime value.
notes: |-
