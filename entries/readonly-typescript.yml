id: readonly-typescript
language: en
word: "readonly"
part_of_speech: keyword
meaning: "只读修饰符，限制通过该类型写入属性"
example: "The readonly modifier prevents reassignment through this reference."
code_example: |-
  type View = { readonly id: number };
  const mutable = { id: 1 };
  const view: View = mutable;
  // view.id = 2 would be a type error.
  mutable.id = 2;
  console.log(view.id); // 2; readonly limits writes through the typed view.
notes: |-
  限制通过该类型写入属性。此修饰符不会在运行时冻结对象，也不会使嵌套属性自动只读。

  Source: TypeScript Handbook — Object Types. https://www.typescriptlang.org/docs/handbook/2/objects.html
learning_priority: 2
prerequisites:
  - property-tech
