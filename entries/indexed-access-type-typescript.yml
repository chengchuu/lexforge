id: indexed-access-type-typescript
language: en
word: "indexed access type"
part_of_speech: noun phrase
meaning: "索引访问类型，按键取得另一个类型中的属性类型"
example: "Use an indexed access type to obtain the type of the id property."
code_example: |-
  type User = { id: number; name: string };
  type UserId = User["id"];
  const id: UserId = 7;
  console.log(id.toFixed(0));
notes: |-
