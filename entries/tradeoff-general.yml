id: tradeoff-general
language: en
word: "tradeoff"
pronunciation: /ˈtreɪdˌɔf/
part_of_speech: noun
meaning: "取舍"
context: "选择方案时在不同收益和代价之间作出的平衡。"
example: "Explain the tradeoff that affects maintainability."
notes: |-
  Source: AGENTS.md.

  trade-off 是 tradeoff 的另一种常见拼写。比较方案时明确收益、成本、约束和风险，并记录选择适用的条件。没有脱离场景的最优方案。面试中可说明未选方案及触发重新评估的条件。

  Source: Interviews/AprilSkill.md:1327. Practical workflow summary from the supplied interview notes; not a claimed universal standard.

  来源: Merriam-Webster Dictionary: trade-off。https://www.merriam-webster.com/dictionary/trade-off
word_formation: "trade + off → tradeoff。trade off 表示以一方面换取另一方面；名词 tradeoff 指相互制约条件下的取舍。"
