id: mount-point-docker
language: en
word: "mount point"
part_of_speech: noun
meaning: "挂载点；容器内接入外部文件或存储的位置。"
example: "The application writes its files at the mount point."
code_example: |-
  docker run --rm --mount type=tmpfs,target=/work \
    alpine:3.22 sh -c 'echo ok > /work/status; cat /work/status'
notes: |-
  target 指定容器内的挂载点。此例将临时内存文件系统挂载到 /work。

  Source: Docker Docs — docker container run. https://docs.docker.com/reference/cli/docker/container/run/
learning_priority: 2
prerequisites:
  - container-docker
tags:
  - docker
  - devops
  - noun
