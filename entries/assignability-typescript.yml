id: assignability-typescript
language: en
word: "assignability"
part_of_speech: noun
meaning: "可赋值性，源类型能否用于目标类型所要求的位置"
example: "Assignability determines whether this value can be passed to the parameter."
code_example: |-
  type Named = { name: string };
  const user = { name: "Ada", admin: true };
  const named: Named = user; // user has the required member.
  console.log(named.name);
  // const invalid: Named = { name: 42 }; // Not assignable.
notes: |-
  Source: TypeScript Handbook — Type Compatibility. https://www.typescriptlang.org/docs/handbook/type-compatibility.html
learning_priority: 2
prerequisites:
  - type-tech
audio: assignability-typescript.mp3
