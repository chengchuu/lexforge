id: tantei-sa
language: ja
word: "探偵さ！"
pronunciation: "たんていさ"
part_of_speech: phrase
meaning: "是侦探！"
context: "从所给柯南自我介绍中保留的短句，句尾「さ」带随意的断定语气。"
example: "探偵さ！"
notes: |-
  完整来源语句：ボクの名前は江戸川コナン！探偵さ！「さ」在这里是句尾语气。 来源作品: 《名探偵コナン》。

  来源: 小学館《デジタル大辞泉》或《精選版 日本国語大辞典》: さ (コトバンク)。https://kotobank.jp/word/さ-506834
word_formation: "探偵 + さ。さ 是句尾助词，给\"是侦探\"加上断定或强调的口语语气；不是形容词后用于构成名词的 -さ。"
audio: tantei-sa.mp3
learning_priority: 3
prerequisites:
