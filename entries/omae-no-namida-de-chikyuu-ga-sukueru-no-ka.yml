id: omae-no-namida-de-chikyuu-ga-sukueru-no-ka
language: ja
word: "お前の涙でこの地球が救えるのか？"
pronunciation: "おまえのなみだでこのちきゅうがすくえるのか"
part_of_speech: phrase
meaning: "你的眼泪能拯救这个地球吗？"
context: "所给《ウルトラマンレオ》反问，质疑流泪能否带来拯救，保留强烈语气。"
example: "お前の涙でこの地球が救えるのか？"
notes: "救う → 救える（可能形）。「のか」在这里带强烈反问，保留直接的「お前」，不改写为礼貌疑问句。"
