id: chisou
language: ja
word: "馳走"
pronunciation: "ちそう"
part_of_speech: noun
meaning: "奔走准备；款待的词源形式"
context: "在「ご馳走」等表达中学习的词形；词源说明涉及奔走准备与款待。"
example: "「ご馳走」の「馳走」は「ちそう」と読みます。"
notes: "来源: 小学館《デジタル大辞泉》或《精選版 日本国語大辞典》: 馳走 (コトバンク)。https://kotobank.jp/word/馳走-565923"
etymology: "馳走 原可表示奔走，后有为他人张罗、照料的意思，再用于用心招待及所准备的食物。这里的历史联系是为款待而奔走，不是现代语境中见到 馳走 都译成跑步。"
