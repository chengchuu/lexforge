id: disassemble-general
language: en
word: disassemble
pronunciation: /ˌdɪs.əˈsem.bəl/
part_of_speech: verb
meaning: 拆卸；拆解
example: Disassemble the frame before moving it.
notes: |-
  Source: user-supplied Nintendo Switch & Zelda TOTK vocabulary list.

  拆开人为组装的物件用 disassemble，例如拆开车架。decompose 表示物质分解或有机物腐解。

  Pronunciation source: Cambridge Dictionary — disassemble. https://dictionary.cambridge.org/us/dictionary/english/disassemble (US, accessed 2026-11-20).
learning_priority: 2
