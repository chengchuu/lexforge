id: shinde-miru
language: ja
word: "死んでみる"
pronunciation: "しんでみる"
part_of_speech: phrase
meaning: "试着死一次看看"
context: "由「死ぬ」的て形与「みる」组成，作为所给作品台词的学习单位。"
example: "「死んでみる」は「死ぬ」に「てみる」を付けた表現です。"
notes: |-
  死ぬ → 死んで + みる。与字典形、语法模式和完整作品短句分别保留。 学习来源: 《地獄少女》。

  来源: 東京外国語大学言語モジュール: Vておきます／Vてみます: 解説。https://www.coelang.tufs.ac.jp/mt/ja/gmod/contents/explanation/088.html
word_formation: "死ぬ → 死んで + みる。死んで 是て形，后接 みる 表示试着做；这是所给作品表达的结构分析，语气结合台词理解。"
audio: shinde-miru.mp3
learning_priority: 2
prerequisites:
  - shinu
  - te-miru-grammar
tags:
