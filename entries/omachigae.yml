id: omachigae
language: ja
word: "お間違え"
pronunciation: "おまちがえ"
part_of_speech: noun
meaning: "弄错；「間違える」的礼貌表达形式"
context: "「間違える」在礼貌表达中的形式，常用于委婉指出对方弄错。"
example: "番号をお間違えではないでしょうか。"
notes: |-
  間違える → お間違え。结合完整礼貌句学习，与名词「間違い」和动词「間違える」分别保留。

  来源: 東京外国語大学言語モジュール: 敬語。https://www.coelang.tufs.ac.jp/mt/ja/gmod/courses/c01/lesson24/step4/card/092.html
word_formation: "お + 間違え。間違え 是 間違える 的连用形，お 加在其前，用于 お間違えではないでしょうか 等礼貌结构；不要与名词 間違い 的词形混同。"
audio: omachigae.mp3
learning_priority: 2
prerequisites:
  - machigaeru
tags:
  - noun
  - polite
