id: nihonjin-dewa-arimasen
language: ja
word: "日本人ではありません"
pronunciation: "にほんじんではありません"
part_of_speech: phrase
meaning: "我不是日本人"
context: "礼貌否定日本人身份，主语可由上下文补足。"
example: "私は日本人ではありません。"
notes: "组合练习句：私は外国人です。日本人ではありません。读音：わたしはがいこくじんです。にほんじんではありません。中文：我是外国人，不是日本人。完整回应保留在备注中。"
