language: en
word: "potato"
pronunciation: "/pəˈteɪtoʊ/"
part_of_speech: noun
meaning: "土豆；马铃薯"
context: "可作主食或配菜的块茎蔬菜；菜单中常用复数 potatoes 表示土豆配菜。"
example: "The fish comes with potatoes."
notes: "复数为 potatoes。mashed potatoes 指土豆泥。\nPronunciation source: Collins Dictionary — potato; potato in American English; Webster’s New World College Dictionary, 5th Digital Edition. https://www.collinsdictionary.com/dictionary/english/potato (accent: US; accessed 2026-11-18)."
