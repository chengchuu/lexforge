id: "fuse-general"
language: "en"
word: "fuse"
part_of_speech: "verb"
meaning: "融合；结合；使物体连接成为一体。"
example: "Fuse a rock to the weapon."
notes: |-
  游戏能力 Fuse 的简体中文名为余料建造，用于将物体与武器、盾或箭结合。普通英语 fuse 可指融合；这里不取保险丝这一名词义。

