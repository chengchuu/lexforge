id: temporal-dead-zone-javascript
language: en
word: "temporal dead zone"
part_of_speech: noun phrase
meaning: "暂时性死区；词法绑定从作用域开始到初始化前不可访问的阶段。"
example: "Accessing the binding in its temporal dead zone throws a ReferenceError."
notes: |
  let 和 const 在初始化前已经影响名称解析，但访问会抛出 ReferenceError。对死区内的绑定使用 typeof 也会抛错；这不同于 typeof 一个未声明的名称。应区分已声明但未初始化与根本没有声明。

  Source: Interviews/AprilSkill.md:477. Import record: guides/INTERVIEW_VOCABULARY_IMPORT_PLAN.md, item 8. Verified reference: MDN: let: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/let
learning_priority: 2
prerequisites:
