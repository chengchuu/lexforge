id: buying-power-finance
language: en
word: "buying power"
part_of_speech: "noun"
meaning: "购买力；按账户和交易规则可用于新增交易的额度。"
example: "Buying power is not the same as withdrawable cash."
notes: |-
  BP = buying power。Max Buying Power 与 Cash BP 是不同标签；不把最大购买力当作自有现金，也不从截图规定固定杠杆倍数或实际可买数量。
  Source: 用户提供的 Moomoo 界面截图，2026-11-06，S6；原标签: Max Buying Power；Cash BP。
  Reference: Moomoo API — Get Account Funds. https://openapi.moomoo.com/moomoo-api-doc/en/trade/get-funds.html
  Reference: Investor.gov — Understanding Margin Accounts. https://www.investor.gov/introduction-investing/general-resources/news-alerts/alerts-bulletins/investor-bulletins-29
