id: cost-finance
language: en
word: "cost"
part_of_speech: "noun"
meaning: "成本；取得或持有某项资产所付出的代价。"
example: "The market price is above the recorded cost."
notes: |-
  Price/Cost 中两者是不同数据。未核实该账户选择的是平均成本、摊薄成本还是其他口径，不擅自规范为 cost basis 或填写费用公式。
