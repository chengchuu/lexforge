id: donata-o-osagashi-phone
language: ja
word: "どなたをお探しですか？"
pronunciation: "どなたをおさがしですか"
part_of_speech: phrase
meaning: "请问您找哪位？"
context: "电话或接待场景中礼貌询问对方想找谁。"
example: "お電話ありがとうございます。どなたをお探しですか？"
word_formation: "どなた（哪位）+ を（标记寻找的对象）+ お探しですか（礼貌地问是否在找）。整句是在问对方找哪位。"
