id: event-delegation-dom
language: en
word: "event delegation"
part_of_speech: noun phrase
meaning: "事件委托；在祖先上监听并处理后代元素的事件。"
example: "Use event delegation for dynamically added buttons."
notes: |
  常用冒泡把多个后代的监听合并到祖先；也可利用捕获处理合适的事件。event.target 指向目标，currentTarget 指向当前监听器所在元素。筛选目标时检查是否属于委托容器，并考虑传播被阻止的情况。

  Source: Interviews/AprilSkill.md:366. Import record: guides/INTERVIEW_VOCABULARY_IMPORT_PLAN.md, item 20. Also: Interviews/March.md. Verified reference: MDN: Event bubbling: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Scripting/Event_bubbling
learning_priority: 2
