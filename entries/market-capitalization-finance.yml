id: market-capitalization-finance
language: en
word: "market capitalization"
part_of_speech: "noun"
meaning: "市值；按市场价格与相应数量口径计算的总体价值。"
example: "The assets are ranked by market capitalization."
notes: |-
  Market Cap 是缩写。股票常按流通在外股数计算，加密资产需区分流通量与完全稀释口径。截图总量范围未核实，不把市值当成真实流入资金。
  Source: 用户提供的 Moomoo 界面截图，2026-11-06，S2；原标签: Market Cap；Crypto Market Cap。
  Reference: Coinbase — What is market cap?. https://www.coinbase.com/learn/crypto-basics/what-is-market-cap
