id: fisshu
language: ja
word: "フィッシュ"
pronunciation: "フィッシュ"
part_of_speech: noun
meaning: "fish；鱼类相关借词"
context: "英语 fish 的借词，多见于商品名或复合词，日常说鱼通常用「魚」。"
example: "メニューに「フィッシュバーガー」と書いてあります。"
notes: "来源: 小学館《デジタル大辞泉》或《精選版 日本国語大辞典》: フィッシュ (コトバンク)。https://kotobank.jp/word/ふいつしゆ-3185695"
etymology: "フィッシュ 借自英语 fish，表示鱼或鱼类，常作为复合词的构成成分，例如 フィッシュバーガー。这里说明的是借词来源，不据此推导所有英语发音到片假名的转换规则。"
