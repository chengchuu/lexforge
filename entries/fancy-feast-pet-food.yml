id: fancy-feast-pet-food
language: en
word: "Fancy Feast"
part_of_speech: proper noun
meaning: "珍致；普瑞纳旗下的猫粮品牌，销售猫咪湿粮。"
example: "She bought a few cans of Fancy Feast."
notes: |-
  作为记忆提示，fancy 是「讲究的」，feast 是「盛宴」。

