id: landmark-html
language: en
word: "landmark"
pronunciation: "/ˈlænd.mɑːrk/"
part_of_speech: noun
meaning: "地标区域，可供辅助技术识别和导航的页面区域"
example: "The main landmark identifies the page's primary content."
code_example: |-
  <nav aria-label="Primary"><a href="#details">Details</a></nav>
  <main id="details"><h1>Reservation details</h1></main>
notes: |-
  例如 main 通常标识主要内容区域，nav 通常标识导航区域。

  Source: W3C WAI — Page Structure Tutorial. https://www.w3.org/WAI/tutorials/page-structure/

  Pronunciation source: Cambridge Dictionary — landmark (US, accessed 2026-11-19). https://dictionary.cambridge.org/pronunciation/english/landmark
mnemonic: "用法助记：纸质地图上先找显眼标记；在 HTML 里可把 landmark 想成帮助定位的页面区域。"
learning_priority: 2
prerequisites:
  - semantic-html
audio: landmark-html.mp3
tags:
  - tech
  - frontend
  - html
  - noun
