id: column-span-html
language: en
word: "column span"
part_of_speech: noun phrase
meaning: "跨列，单元格在表格网格中占据的列数"
example: "Set a column span of two for the group heading."
notes: |-
  用 colspan 指定跨列范围。表头单元格与数据单元格均可使用。

  Source: WHATWG HTML — Tabular data. https://html.spec.whatwg.org/multipage/tables.html
