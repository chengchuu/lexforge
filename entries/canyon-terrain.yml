etymology: "英语 canyon 借自墨西哥西班牙语 cañón。词源词典把峡谷义与“管道、深坑”等含义联系起来，也指出较早的拼法可能提示与 calle（街道）有关。"
mnemonic: "记忆画面：沿一条很深的谷底走，两侧是陡壁。canyon 把注意力放在这道深峡谷，cliff 指陡壁，valley 是更宽泛的谷地概念。"
