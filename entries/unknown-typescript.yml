id: unknown-typescript
language: en
word: "unknown"
pronunciation: "/ʌnˈnoʊn/"
part_of_speech: keyword
meaning: "可接收任意值，使用前需确认具体类型的类型"
example: "Treat the external input as unknown until you check its shape."
notes: |-
  对比：any 允许跳过对值的相关检查，unknown 在多数操作前需要收窄类型，never 表示没有可能的值。

  Source: TypeScript Handbook — More on Functions. https://www.typescriptlang.org/docs/handbook/2/functions.html

  Pronunciation source: Cambridge Dictionary — unknown (US, accessed 2026-11-19). https://dictionary.cambridge.org/dictionary/english/unknown
learning_priority: 2
prerequisites:
  - type-tech
tags:
  - tech
  - programming
  - typescript
