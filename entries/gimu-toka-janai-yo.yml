id: gimu-toka-janai-yo
language: ja
word: "義務とかじゃないよ"
pronunciation: "ぎむとかじゃないよ"
part_of_speech: phrase
meaning: "这不是什么义务"
context: "所给《ウルトラマンティガ》短语，以口语否定义务之类的动机。"
example: "義務とかじゃないよ。"
notes: |-
  来源语句：義務とかじゃないよ。俺は人間だから。俺がやれることをやりたいだけだよ。 来源作品: 《ウルトラマンティガ》。

  来源: 国際交流基金《いろどり》入門 第3課: よろしくお願いします。https://www.irodori.jpf.go.jp/assets/data/starter/pdf/X_L03.pdf
word_formation: "義務 + とか + じゃない + よ。とか 在这里将\"义务之类\"概括提出，じゃない 是 ではない 的口语形式；整体是否定，并非在列举两项义务。"
