language: en
word: "array"
part_of_speech: noun
meaning: "数组；按索引组织元素的集合。"
example: "The array contains the generated records."
notes: |
  JavaScript Array 是可调整长度的对象，索引从 0 开始，并可包含不同类型的值。不能把其他语言中固定大小或连续布局的承诺直接套用到 JavaScript。数组展开是构造数组等场景中的具体语法。
