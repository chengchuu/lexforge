id: state-preservation-react
language: en
word: "state preservation"
part_of_speech: noun phrase
meaning: "状态保留，React 在后续渲染中继续使用同一组件身份对应的状态"
example: "State preservation keeps the input value when the component renders again."
code_example: |-
  import { useState } from 'react';

  function SeatNote() {
    const [note, setNote] = useState('');
    return <label>Seat note <input value={note} onChange={e => setNote(e.target.value)} /></label>;
  }

  export default function Demo() {
    const [updated, setUpdated] = useState(false);
    return <>
      <h2>{updated ? 'Updated details' : 'Seat details'}</h2>
      <SeatNote />
      <button onClick={() => setUpdated(true)}>Update details</button>
    </>;
  }
notes: |-
  Source: React docs — Preserving and Resetting State. https://react.dev/learn/preserving-and-resetting-state
learning_priority: 2
