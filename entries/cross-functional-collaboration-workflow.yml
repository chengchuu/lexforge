id: cross-functional-collaboration-workflow
language: en
word: "cross-functional collaboration"
part_of_speech: noun phrase
meaning: "跨职能协作；围绕共同目标协调不同角色的工作。"
example: "Cross-functional collaboration clarifies ownership across teams."
notes: |
  先对齐目标、交付物与约束，再明确责任人、接口和时间。用具体证据描述问题，记录决定与待办并及时反馈阻碍。分歧应回到用户价值、成本与风险，不以虚构项目经历证明协作能力。

  Source: Interviews/AprilSkill.md:1331. Import record: guides/INTERVIEW_VOCABULARY_IMPORT_PLAN.md, item 55. Practical workflow summary from the supplied interview notes; not a claimed universal standard.
