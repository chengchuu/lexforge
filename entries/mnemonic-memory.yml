id: mnemonic-memory
language: en
word: "mnemonic"
part_of_speech: noun
meaning: "助记法；帮助记忆的提示或方法。"
context: "可用联想、缩写或其他提示帮助记忆，但提示本身不一定是事实解释。"
example: "A mnemonic can help me retain the spelling."
notes: |
  这里学习名词用法；也可作形容词，如 mnemonic device。词首 m 不发音。助记应与已核实的词源、构词说明区分，避免把联想当成历史事实。
  Source: user-supplied LexForge field-label vocabulary.
  Reference: Merriam-Webster: mnemonic: https://www.merriam-webster.com/dictionary/mnemonic
etymology: "来自希腊语 mnemonikos (与记忆有关的)，关联 mnemon (记得的、留心的) 与表示记忆的动词 mimneskesthai。这解释了它与记忆的联系，不必把现代拼写机械拆成几个英语词。"
mnemonic: "mnemonic 的词首 m 不发音，发音从 n 开始；记住\"写 m，读 n 开头\"，不要按每个字母逐个拼读。"
learning_priority: 2
