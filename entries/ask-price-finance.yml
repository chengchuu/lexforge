id: ask-price-finance
language: en
word: "ask price"
part_of_speech: "noun"
meaning: "卖方报价；行情中卖方愿意接受的卖出报价。"
example: "The ask price is shown beside the bid price."
notes: |-
  报价表常显示最低卖价；不是普通提问的 ask。报价可能变化，不保证任何订单按显示价成交。
