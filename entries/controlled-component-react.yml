id: controlled-component-react
language: en
word: "controlled component"
part_of_speech: noun phrase
meaning: "受控组件，相关状态或行为主要由外部属性控制的组件"
example: "The parent passes the selected value to the controlled component."
code_example: |-
  import { useState } from 'react';

  function CityField({ value, onChange }) {
    return <label>City <input value={value} onChange={e => onChange(e.target.value)} /></label>;
  }

  export default function Demo() {
    const [city, setCity] = useState('');
    return <><CityField value={city} onChange={setCity} /><output>{city}</output></>;
  }
notes: |-
  Source: React docs — Managing State. https://react.dev/learn/managing-state
learning_priority: 2
