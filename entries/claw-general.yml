id: claw-general
language: en
word: "claw"
pronunciation: /klɑː/
part_of_speech: noun
meaning: "爪；动物的尖爪或龙虾等动物的螯。"
example: "The lobster raised one claw."
notes: |
  本条学习普通名词用法，claws 为常见复数。作为 OpenClaw 的可识别组成词学习，不推定品牌命名史。
