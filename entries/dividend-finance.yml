id: dividend-finance
language: en
word: "dividend"
pronunciation: "/ˈdɪvəˌdɛnd/"
part_of_speech: "noun"
meaning: "股息；公司向股东分配的收益。"
example: "The company announced a dividend."
notes: |-
  是否分配、金额和时间需看具体决定；不能把所有盈利自动当作会分给股东的股息。
  Source: 用户提供的 Moomoo 界面截图，2026-11-06，S1；原标签: Dividends。
  Reference: SEC — Beginners’ Guide to Financial Statements. https://www.sec.gov/about/reports-publications/beginners-guide-financial-statements
  Pronunciation source: Collins Dictionary — dividend; dividend in American English. https://www.collinsdictionary.com/dictionary/english/dividend (accent: US; accessed 2026-11-18).

  Memory-aid source: Online Etymology Dictionary — dividend. https://www.etymonline.com/word/dividend
etymology: "dividend 来自拉丁语 dividendum，意思近于“有待分配之物”，与表示分开、分配的 dividere 同源。用“可分配的一份”记住当前的股息义。"
learning_priority: 2
