id: tsuki-ni-kawatte-oshioki-yo
language: ja
word: "月にかわっておしおきよ！"
pronunciation: "つきにかわっておしおきよ"
part_of_speech: phrase
meaning: "我要代表月亮惩罚你！"
context: "所给《美少女戦士セーラームーン》短句，「かわって」表示代表或代替。"
example: "月にかわっておしおきよ！"
notes: "「月にかわって」表示代表月亮；不是变成月亮。台词保留「おしおき」写法，对应一般词条「お仕置き」。 来源作品: 《美少女戦士セーラームーン》。"
