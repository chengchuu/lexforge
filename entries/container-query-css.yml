id: container-query-css
language: en
word: "container query"
part_of_speech: noun phrase
meaning: "容器查询，根据查询容器的尺寸或样式等特征有条件地应用样式"
example: "A container query changes the card layout when its container gets wider."
notes: |-
  尺寸查询使用符合条件的容器。典型用途是根据组件可用空间改变其布局。

  Source: MDN — CSS container queries. https://developer.mozilla.org/en-US/docs/Web/CSS/Guides/Containment/Container_queries
learning_priority: 3
prerequisites:
