id: "recall-general"
language: "en"
word: "recall"
pronunciation: "/rɪˈkɔl/"
part_of_speech: "verb"
meaning: "回想；召回；叫回。"
example: "I cannot recall the route."
notes: |-
  游戏能力名 Recall 对应倒转乾坤，令物体沿其先前的运动轨迹逆向运动。这是能力名的特殊用法，不是一般动词 recall 的字面定义。

