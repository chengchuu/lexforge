id: backing-array-go
language: en
word: "backing array"
part_of_speech: noun phrase
meaning: "切片所引用的底层数组"
example: "Two slices can share the same backing array."
code_example: |-
  package main

  import (
      "fmt"
  )

  func main() {
      a := [3]int{1, 2, 3}
      view := a[1:]
      view[0] = 9
      fmt.Println(a) // [1 9 3]
  }
