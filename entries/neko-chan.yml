id: neko-chan
language: ja
word: "猫ちゃん"
pronunciation: "ねこちゃん"
part_of_speech: noun
meaning: "猫猫；对猫的亲昵称呼"
context: "对猫的亲昵称呼，比「猫」更显亲近。"
example: "あの猫ちゃんはよく寝ています。"
notes: |-
  「ちゃん」表示亲近，不限定猫的年龄；「子猫」才专指年幼的猫。

  来源: 国語辞典オンライン: ちゃん。https://kokugo.jitenon.jp/word/p32740
word_formation: "猫 + ちゃん。ちゃん 是表示亲昵的称呼后缀；猫ちゃん 带亲近语气，不表示小猫的年龄。"
audio: neko-chan.mp3
learning_priority: 2
prerequisites:
  - chan-suffix
  - neko
tags:
  - noun
