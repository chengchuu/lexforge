id: jibun-jishin-no-chikara-de
language: ja
word: "自分自身の力で"
pronunciation: "じぶんじしんのちからで"
part_of_speech: phrase
meaning: "凭自己的力量"
context: "所给《ウルトラマンティガ》短语，用「で」表示凭借自己的力量。"
example: "自分自身の力で光になれるんだ。"
notes: |-
  来源语句：人間はみんな、自分自身の力で光になれるんだ。 来源作品: 《ウルトラマンティガ》。

  来源: 東京外国語大学言語モジュール: NのN。https://www.coelang.tufs.ac.jp/mt/ja/gmod/courses/c01/lesson03/step1/card/008.html
word_formation: "自分自身 + の + 力 + で。自分自身 强调自己，の 连接所属，で 表示凭借的手段；整体是凭自己的力量。"
