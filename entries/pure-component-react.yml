id: pure-component-react
language: en
word: "pure component"
part_of_speech: noun phrase
meaning: "纯组件，渲染时没有副作用，并对相同的 props、state 和 context 产生相同输出的组件"
example: "A pure component derives its output from its inputs."
notes: |-
  这里指通用的渲染纯性。React.PureComponent 则是具体的类组件 API。

  Source: React docs — Keeping Components Pure. https://react.dev/learn/keeping-components-pure
learning_priority: 2
