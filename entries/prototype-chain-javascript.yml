id: prototype-chain-javascript
language: en
word: "prototype chain"
part_of_speech: noun phrase
meaning: "原型链；沿对象的原型关系逐层查找属性。"
example: "An inherited getter can be found through the prototype chain."
notes: |
  先查找对象自身属性，再沿 [[Prototype]] 查找，直到找到属性或到达 null。自有同名属性可以遮蔽原型属性。对象的原型与构造函数的 prototype 属性不是同一个概念。

