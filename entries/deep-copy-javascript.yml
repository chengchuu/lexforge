id: deep-copy-javascript
language: en
word: "deep copy"
part_of_speech: noun phrase
meaning: "深拷贝；复制嵌套数据，使相应对象引用与原数据隔离。"
example: "A deep copy isolates changes to nested data."
notes: |
  先确定需要支持的类型和共享引用语义。structuredClone 支持多种类型和循环引用，但不能复制函数等所有值。JSON 往返会丢失或改变部分数据，也不能处理循环引用，不是通用深拷贝方案。

