id: volume-docker
language: en
word: "volume"
pronunciation: /ˈvɑːl.juːm/
part_of_speech: noun
meaning: "卷；由 Docker 管理、可独立于容器生命周期存在的存储。"
example: "Mount a volume at the application’s data directory."
code_example: |-
  (
    volume=$(docker volume create) || exit
    trap 'docker volume rm "$volume" >/dev/null' EXIT
    docker run --rm --mount "type=volume,src=$volume,dst=/data" \
      alpine:3.22 ls -ld /data
  )
notes: |-
  创建一个独立的卷，并把它挂载到容器的 /data。示例结束时删除该卷。

  Source: Docker Docs — Volumes. https://docs.docker.com/engine/storage/volumes/
  Pronunciation source: Cambridge Dictionary — volume. https://dictionary.cambridge.org/dictionary/english/volume (US, accessed 2026-11-20).
learning_priority: 2
prerequisites:
  - mount-point-docker
tags:
  - docker
  - devops
  - noun
