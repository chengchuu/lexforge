id: two-way-binding-frontend
language: en
word: "two-way binding"
part_of_speech: noun phrase
meaning: "双向绑定；让状态值与界面输入保持相互同步的绑定方式。"
example: "Use two-way binding for the form input."
notes: |
  Vue 3 的组件 v-model 可展开为值属性与更新事件。双向绑定提供便捷接口，不代表任意组件可以任意修改全局状态。区分表单同步语法和整个应用的数据流设计。

