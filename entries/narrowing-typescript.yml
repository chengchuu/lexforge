id: narrowing-typescript
language: en
word: "narrowing"
pronunciation: "UK /ˈnærəʊɪŋ/"
part_of_speech: noun
meaning: "类型收窄，根据检查和控制流缩小可能的类型"
example: "Narrowing lets us treat the value as a string after the check."
code_example: |-
  function format(value: string | number) {
    return typeof value === "number" ? value.toFixed(1) : value.trim();
  }
  console.log(format(3), format(" go ")); // 3.0 go
notes: |-
  Source: TypeScript Handbook — Narrowing. https://www.typescriptlang.org/docs/handbook/2/narrowing.html

  Pronunciation source: Collins Dictionary — narrowing; British English. https://www.collinsdictionary.com/dictionary/english/narrowing (accent: UK; accessed 2026-11-22).
learning_priority: 2
