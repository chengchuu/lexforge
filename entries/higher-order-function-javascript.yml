id: higher-order-function-javascript
language: en
word: "higher-order function"
part_of_speech: noun phrase
meaning: "高阶函数；接收函数作为参数或返回函数的函数。"
example: "The adapter accepts a higher-order function."
code_example: |-
  function greaterThan(limit) {
    return value => value > limit;
  }
  const aboveTen = greaterThan(10);
  console.log([5, 11, 20].filter(aboveTen)); // [ 11, 20 ]
notes: |
  函数可作为普通值传递，因此可以把变化的行为交给参数。map 接收转换函数；工厂函数可以返回带闭包的函数。高阶函数不必异步执行，也不一定创建闭包。

  Source: Interviews/AprilSkill.md. Verified reference: MDN: First-class function: https://developer.mozilla.org/en-US/docs/Glossary/First-class_Function
learning_priority: 2
