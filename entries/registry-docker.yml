id: registry-docker
language: en
word: "registry"
pronunciation: /ˈredʒ.ə.stri/
part_of_speech: noun
meaning: "镜像注册中心；提供镜像存储、分发和拉取的服务。"
example: "Our build pulls the base image from a registry."
code_example: |-
  docker pull docker.io/library/alpine:3.22
notes: |-
  docker.io 是 Docker Hub 的镜像注册中心地址。该命令从 Docker Hub 拉取公开镜像。

  Source: Docker Docs — What is a registry?. https://docs.docker.com/get-started/docker-concepts/the-basics/what-is-a-registry/
  Pronunciation source: Cambridge Dictionary — registry. https://dictionary.cambridge.org/dictionary/english/registry (US, accessed 2026-11-20).
mnemonic: "记忆画面：一边放镜像供拉取，一边放源码和版本历史。前者对应当前 Docker registry 卡，后者对应 Git repository 卡。"
related_entries:
  - repository-git
learning_priority: 2
prerequisites:
  - image-docker
audio: registry-docker.mp3
tags:
  - docker
  - devops
  - noun
