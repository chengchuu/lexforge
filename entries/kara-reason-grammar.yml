id: kara-reason-grammar
language: ja
word: "～から"
pronunciation: "～から"
part_of_speech: phrase
meaning: "因为……"
context: "此处表示理由，接在原因说明后，不学习表示起点的用法。"
example: "雨が降っているから、家にいます。"
notes: "学习来源: 《NARUTO -ナルト-》、《ウルトラマンティガ》。"
mnemonic: "用法助记：地名から来ました 回答“从哪儿来”；雨が降っているから 回答“为什么”。看到 から 先看前面是地点还是理由句。"
