id: garbage-collection-javascript
language: en
word: "garbage collection"
part_of_speech: noun phrase
meaning: "垃圾回收；自动回收不再可达的对象所占内存。"
example: "An unused reference can delay garbage collection."
notes: |
  标记清除从根开始追踪可达对象，再回收不可达部分。循环引用本身不阻止基于可达性的回收。仍被缓存、监听器或闭包引用的对象可能继续存活。回收时机由运行时决定。

