id: toast-bootstrap
language: en
word: "toast"
pronunciation: "/toʊst/"
part_of_speech: noun
meaning: "轻提示，用于呈现简短消息的轻量通知组件"
example: "Show a toast after copying the link."
code_example: |-
  <button type="button" class="btn btn-primary" id="save">Save</button>
  <div role="status" aria-atomic="true">
    <div class="toast" id="notice">
      <div class="d-flex align-items-center">
        <div class="toast-body">Ticket saved.</div>
        <button type="button" class="btn-close me-2" data-bs-dismiss="toast"
                aria-label="Dismiss notification"></button>
      </div>
    </div>
  </div>
  <script>
    const notice = new bootstrap.Toast('#notice', { autohide: false });
    document.querySelector('#save').onclick = () => notice.show();
  </script>
notes: |-
  Source: Bootstrap 5.3 documentation — toasts. https://getbootstrap.com/docs/5.3/components/toasts/

  Pronunciation source: Cambridge Dictionary — toast (US, accessed 2026-11-19). https://dictionary.cambridge.org/pronunciation/english/toast
learning_priority: 2
prerequisites:
  - bootstrap-framework
audio: toast-bootstrap.mp3
tags:
