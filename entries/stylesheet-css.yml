id: stylesheet-css
language: en
word: "stylesheet"
pronunciation: "/ˈstaɪl ˌʃiːt/"
part_of_speech: noun
meaning: "样式表，包含用于设置文档样式的规则"
example: "Link the stylesheet from the document head."
code_example: |-
  <style>
    /* This style element supplies an embedded stylesheet. */
    .sample { color: navy; }
    .sample strong { text-decoration: underline; }
  </style>
  <p class="sample">Train <strong>arriving</strong></p>
notes: |-
  Source: MDN — CSS styling basics. https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Styling_basics

  Pronunciation source: Cambridge Dictionary — style sheet (English pronunciation). https://dictionary.cambridge.org/pronunciation/english/style-sheet (accent: US; accessed 2026-11-22).
learning_priority: 1
prerequisites:
  - css-language
audio: stylesheet-css.mp3
