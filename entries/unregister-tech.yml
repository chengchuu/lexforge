id: unregister-tech
language: en
word: "unregister"
pronunciation: /ˌʌnˈrɛdʒəstər/
part_of_speech: verb
meaning: "取消注册"
context: "将已注册对象从集合或机制中移除。"
example: "Unregister the counter during cleanup."
notes: |-
  Source: reports/react-candidates.md.

  来源: Merriam-Webster Dictionary: un-。https://www.merriam-webster.com/dictionary/un-
word_formation: "un- + register。un- 在这里表示撤销原动作；unregister 是取消已有注册，例如移除处理器的注册。"
mnemonic: "register 将对象或处理器加入系统集合，unregister 将其移除；按加入与清理两个方向联想。"
