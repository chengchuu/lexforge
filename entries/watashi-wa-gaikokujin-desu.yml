id: watashi-wa-gaikokujin-desu
language: ja
word: "私は外国人です"
pronunciation: "わたしはがいこくじんです"
part_of_speech: phrase
meaning: "我是外国人"
context: "在沟通需要时礼貌说明自己是外国人。"
example: "私は外国人です。日本語を勉強しています。"
notes: "组合练习句：私は外国人です。日本人ではありません。读音：わたしはがいこくじんです。にほんじんではありません。中文：我是外国人，不是日本人。两个短句分别建条目，组合句不另建卡片。\nMemory-aid source: The Japan Foundation — Irodori Starter, Lesson 3: よろしくお願いします. https://www.irodori.jpf.go.jp/assets/data/starter/pdf/X_L03.pdf"
word_formation: "私 + は + 外国人 + です。は 标记话题，作助词时读 わ；外国人です 说明身份。自我介绍中主语清楚时，可以省略 私は。"
