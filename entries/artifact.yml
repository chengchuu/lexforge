id: artifact-tech
language: en
word: artifact
pronunciation: /ˈɑrtəˌfækt/
part_of_speech: noun
meaning: 构建产物
context: 构建、编译或 CI 流程生成的文件，例如可执行文件、安装包或测试报告。
example: Upload the build artifacts after the test job completes.
notes: "来源: Merriam-Webster Dictionary: artifact。https://www.merriam-webster.com/dictionary/artifact"
etymology: "来自新拉丁语 arte factus (经人为制作的)，其中 arte 源自表示技艺的 ars，factus 是 facere (制作、做) 的过去分词。技术中的 artifact 延伸为生成的产物；不要拆成现代英语的 art 加 fact。"
mnemonic: "构建产物是工作成果的一种；两个 artifact 的范围不同，不要把所有工作文件都理解为编译输出。"
