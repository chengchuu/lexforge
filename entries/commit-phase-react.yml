id: commit-phase-react
language: en
word: "commit phase"
part_of_speech: noun phrase
meaning: "提交阶段，React 将需要的 DOM 变更应用到页面"
example: "React applies the DOM changes during the commit phase."
code_example: |-
  import { useState } from 'react';

  export default function Demo() {
    const [heading, setHeading] = useState(null);
    return <>
      <h2 ref={setHeading}>Departures</h2>
      <output>{heading?.isConnected ? 'Heading is in the DOM' : 'Waiting'}</output>
    </>;
  }
