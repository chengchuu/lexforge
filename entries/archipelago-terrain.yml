etymology: "英语 archipelago 借自原指爱琴海的意大利语 arcipelago。词义后来扩展到遍布岛屿的海域，再指岛屿本身组成的群岛。关于意大利语形式的形成，有意大利语复合和由中世纪拉丁语 Egeopelagus 演变两种解释。"
