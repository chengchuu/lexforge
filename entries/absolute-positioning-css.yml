id: absolute-positioning-css
language: en
word: "absolute positioning"
part_of_speech: noun phrase
meaning: "绝对定位，使盒子脱离常规流并根据包含块定位"
example: "Absolute positioning places the badge in the corner of its container."
code_example: |-
  <style>
    .sample { position: relative; min-height: 4rem; background: aliceblue; }
    .sample span { position: absolute; inset: auto 8px 8px auto; }
  </style>
  <div class="sample"><span>Corner</span></div>
