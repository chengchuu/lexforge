id: cache-revalidation-web
language: en
word: "cache revalidation"
part_of_speech: noun phrase
meaning: "缓存再验证；向服务器确认已存储响应能否继续使用。"
example: "The ETag supports cache revalidation."
notes: |
  携带 ETag 对应的 If-None-Match，或使用 Last-Modified 对应的 If-Modified-Since。资源未变时可收到 304 并复用缓存正文；变化时通常返回新响应。验证需要通信，与直接复用新鲜缓存不同。

