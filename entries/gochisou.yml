id: gochisou
language: ja
word: "ごちそう"
pronunciation: "ごちそう"
part_of_speech: noun
meaning: "盛宴；好饭菜；款待"
context: "指丰盛的饭菜或款待，也用于表达请客。"
example: "今日はごちそうが並んでいます。"
notes: |-
  汉字写法：ご馳走（ごちそう）；同样可表示盛宴或款待。作为文字变体合并，不另建卡片。

  来源: 小学館《デジタル大辞泉》或《精選版 日本国語大辞典》: 御馳走 (コトバンク)。https://kotobank.jp/word/御馳走-502226
  来源: 小学館《デジタル大辞泉》或《精選版 日本国語大辞典》: 馳走 (コトバンク)。https://kotobank.jp/word/馳走-565923
etymology: "ごちそう 对应 御馳走，是在 馳走 前加 ご 的形式。馳走 原有奔走、周旋的意思，后用于用心招待，尤其是提供饭食；后来加 ご 的形式逐渐普遍。用这条语义联系理解款待，不另编宗教或人物故事。"
