id: pepper-food
language: en
word: "pepper"
pronunciation: "/ˈpɛpər/"
part_of_speech: noun
meaning: "胡椒；胡椒粉"
context: "本条指用于调味的胡椒或胡椒粉，通常作不可数名词；不指作为蔬菜的甜椒或辣椒。"
example: "Would you like some pepper on your food?"
notes: "Black pepper 指黑胡椒；常见搭配是 salt and pepper（盐和胡椒）。\nPronunciation source: Collins Dictionary — pepper; pepper in American English; Webster’s New World College Dictionary, 5th Digital Edition. https://www.collinsdictionary.com/dictionary/english/pepper (accent: US; accessed 2026-11-18)."
