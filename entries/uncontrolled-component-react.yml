id: uncontrolled-component-react
language: en
word: "uncontrolled component"
part_of_speech: noun phrase
meaning: "非受控组件，相关状态主要由组件自身或 DOM 管理的组件"
example: "An uncontrolled component can manage its own input value."
code_example: |-
  import { useState } from 'react';

  export default function Demo() {
    const [submitted, setSubmitted] = useState('');
    function submit(event) {
      event.preventDefault();
      setSubmitted(new FormData(event.currentTarget).get('city'));
    }
    return <>
      <form onSubmit={submit}>
        <label>City <input name="city" defaultValue="Osaka" /></label>
        <button>Submit</button>
      </form>
      <output>{submitted}</output>
    </>;
  }
notes: |-
  Source: React docs — Managing State. https://react.dev/learn/managing-state
learning_priority: 2
