id: janai-grammar
language: ja
word: "～じゃない"
pronunciation: "～じゃない"
part_of_speech: phrase
meaning: "不是……"
context: "「ではない」的口语形式，用于否定名词或な形容词谓语。"
example: "これは私の電話じゃない。"
notes: "学习来源: 《ウルトラマンティガ》。"
word_formation: "名词或な形容词词干 + じゃない，用于口语否定。じゃない 对应较完整的 ではない；需要礼貌表达时，本库另有 ではありません。"
