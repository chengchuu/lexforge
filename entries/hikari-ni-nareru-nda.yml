id: hikari-ni-nareru-nda
language: ja
word: "光になれるんだ"
pronunciation: "ひかりになれるんだ"
part_of_speech: phrase
meaning: "能够成为光"
context: "所给《ウルトラマンティガ》短语，结合可能形式与解释、强调语气。"
example: "光になれるんだ。"
notes: |-
  来源语句：人間はみんな、自分自身の力で光になれるんだ。「なる」的可能形式为「なれる」。 来源作品: 《ウルトラマンティガ》。

  来源: 東京外国語大学言語モジュール: 可能形。https://www.coelang.tufs.ac.jp/mt/ja/gmod/courses/c01/lesson18/step3/card/074.html
word_formation: "光 + に + なれる + んだ。に 指变化的结果，なれる 表示能够成为，んだ 为解释或强调语气；保留所给作品的比喻语境。"
audio: hikari-ni-nareru-nda.mp3
learning_priority: 3
prerequisites:
