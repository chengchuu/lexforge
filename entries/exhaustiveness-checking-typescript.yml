id: exhaustiveness-checking-typescript
language: en
word: "exhaustiveness checking"
part_of_speech: noun phrase
meaning: "穷尽性检查，确认代码覆盖了所有可能的情况"
example: "Exhaustiveness checking catches a case missing from the switch."
code_example: |-
  type Shape = { kind: "circle"; radius: number } | { kind: "square"; side: number };
  function area(shape: Shape): number {
    switch (shape.kind) {
      case "circle": return Math.PI * shape.radius ** 2;
      case "square": return shape.side ** 2;
      default: {
        const exhaustive: never = shape;
        return exhaustive;
      }
    }
  }
  // Adding a third variant requires updating the switch.
  console.log(area({ kind: "square", side: 4 }));
notes: |-
  Source: TypeScript Handbook — Narrowing. https://www.typescriptlang.org/docs/handbook/2/narrowing.html
learning_priority: 2
