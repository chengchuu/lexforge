id: defer-go
language: en
word: "defer"
pronunciation: "/dɪˈfɝː/"
part_of_speech: keyword
meaning: "延迟调用，在外围函数返回前按后进先出顺序运行已安排的调用"
example: "Use defer to close the file before the function returns."
code_example: |-
  package main

  import (
      "fmt"
  )

  func main() {
      defer fmt.Println("first deferred")
      defer fmt.Println("second deferred")
      fmt.Println("body")
      // Output: body, second deferred, first deferred (one per line).
  }
notes: |-
  安排 defer 调用时会求值函数值及实参，实际调用在外围函数退出前执行。

  Source: Go specification — Defer statements. https://go.dev/ref/spec#Defer_statements

  Pronunciation source: Cambridge Dictionary — defer (US, accessed 2026-11-19). https://dictionary.cambridge.org/pronunciation/english/defer
mnemonic: "用法助记：普通 defer 可泛指推迟。读 Go 代码时，看到 defer 就去找外围函数何时结束，多个已安排的调用按后进先出执行。"
