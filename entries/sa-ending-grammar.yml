id: sa-ending-grammar
language: ja
word: "～さ"
pronunciation: "～さ"
part_of_speech: phrase
meaning: "句尾表示断定、强调等语气"
context: "此处学习随意口语中的句尾语气，不是构成名词的接尾词「さ」。"
example: "大丈夫さ。"
notes: |-
  只学习所给句尾用法；不与「大きさ」等名词化接尾词混为一谈。 学习来源: 《名探偵コナン》。

  来源: 小学館《デジタル大辞泉》或《精選版 日本国語大辞典》: さ (コトバンク)。https://kotobank.jp/word/さ-506834
mnemonic: "探偵さ 中的 さ 在句尾补充语气；高さ 中的 さ 则构成表示程度的名词。同一个假名，不代表同一种语法作用。"
audio: sa-ending-grammar.mp3
learning_priority: 2
