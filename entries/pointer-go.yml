id: pointer-go
language: en
word: "pointer"
pronunciation: "/ˈpɔɪn.t̬ɚ/"
part_of_speech: noun
meaning: "指针，保存变量地址的值"
example: "Pass a pointer so the function can update the counter."
code_example: |-
  package main

  import (
      "fmt"
  )

  func main() {
      n := 3
      p := &n
      *p = 9
      fmt.Println(n) // 9
  }
notes: |-
  Source: Go specification — Types. https://go.dev/ref/spec#Types

  Pronunciation source: Cambridge Dictionary — pointer (US, accessed 2026-11-19). https://dictionary.cambridge.org/us/pronunciation/english/pointer
learning_priority: 1
prerequisites:
  - type-tech
audio: pointer-go.mp3
tags:
