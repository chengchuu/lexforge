pronunciation: "ブラジルエアー"
part_of_speech: noun
meaning: "用户所给的航空公司名称；ブラジルエアー"
context: "按用户提供的 Brazil 航空公司名称语境学习，保留「ブラジルエアー」写法。"
example: "資料には「ブラジルエアー」と書いてあります。"
notes: |-
  可识别的构成部分为国家名「ブラジル」和外来语「エアー」。先学习子项，再识读整体名称。
  「エアー」具有航空相关用法，但不能据此确认整体对应实际航空公司。
  不据名称推定实际机构身份或其他背景，也不把构成分析当作已核实的命名来历。

  来源: 小学館《デジタル大辞泉》或《精選版 日本国語大辞典》: エア (コトバンク)。https://kotobank.jp/word/えあ-1509216

  用户补充确认 (2026-11-03): 此处指 Brazil 航空公司。按用户提供的名称语境理解，不自行对应某家正式注册的航空公司，也不补写运营状态、航线或官方英文商号。
word_formation: "ブラジル + エアー。可识别为\"巴西\"与源自 air 的成分；这里只分析名称中的普通成分，不确认具体航空公司或命名来历。"
