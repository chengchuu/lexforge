id: rerender-react
language: en
word: "re-render"
part_of_speech: noun
meaning: "重新渲染，再次运行组件以计算下一次界面输出"
example: "Updating the selected item can trigger a re-render."
code_example: |-
  import { useState } from 'react';

  function Seats({ remaining }) {
    return <p>{remaining} {remaining === 1 ? 'seat' : 'seats'} available</p>;
  }

  export default function Demo() {
    const [remaining, setRemaining] = useState(2);
    return <><button onClick={() => setRemaining(1)}>Reserve</button><Seats remaining={remaining} /></>;
  }
notes: |-
  Source: React docs — Render and Commit. https://react.dev/learn/render-and-commit
word_formation: "re-（再次）+ render（渲染）。re-render 是再次运行渲染以计算界面输出。"
learning_priority: 1
prerequisites:
  - render-react
audio: rerender-react.mp3
tags:
  - tech
  - frontend
  - react
  - noun
