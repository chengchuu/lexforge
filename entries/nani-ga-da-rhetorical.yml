id: nani-ga-da-rhetorical
language: ja
word: "何が～だ"
pronunciation: "なにが～だ"
part_of_speech: phrase
meaning: "这算什么……；还谈什么……"
context: "反问式地否定或质疑对方的说法，不是中性的定义提问。"
example: "何が正義だ！"
notes: "学习来源: 《ウルトラマンティガ》。"
word_formation: "何が + 被质疑的词 + だ。在 何が正義だ！ 中，正義 是被质疑的说法，整体是在反驳对方。"
