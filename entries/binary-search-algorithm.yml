id: binary-search-algorithm
language: en
word: "binary search"
part_of_speech: noun phrase
meaning: "二分查找；在有序区间中比较中点并排除一半候选。"
example: "Binary search halves the remaining interval at each step."
notes: |
  采用闭区间 [left, right] 时，目标小于中点则 right = mid - 1，大于中点则 left = mid + 1。left > right 时停止。每轮严格缩小区间，时间复杂度为 O(log n)。重复值的首末位置需要单独定义返回规则，空数组也应正常结束。

