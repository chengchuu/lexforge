id: rest-parameter-typescript
language: en
word: "rest parameter"
part_of_speech: noun phrase
meaning: "剩余参数，将剩余实参收集为数组的形参"
example: "The rest parameter collects the remaining arguments into an array."
code_example: |-
  function sum(...values: number[]) {
    return values.reduce((a, b) => a + b, 0);
  }
  console.log(sum(2, 3, 4)); // 9
notes: |-
