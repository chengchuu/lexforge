id: length-go
language: en
word: "length"
pronunciation: "/leŋθ/"
part_of_speech: noun
meaning: "长度，表示切片等值当前包含的元素数"
example: "The slice has a length of three."
code_example: |-
  package main

  import (
      "fmt"
  )

  func main() {
      s := make([]int, 2, 5)
      fmt.Println(len(s)) // 2; the slice currently has two elements.
  }
notes: |-
  Source: Go specification — Built-in functions. https://go.dev/ref/spec#Built-in_functions

  Pronunciation source: Cambridge Dictionary — length (US, accessed 2026-11-19). https://dictionary.cambridge.org/pronunciation/english/length
learning_priority: 1
prerequisites:
  - slice-go
audio: length-go.mp3
tags:
