id: graceful-degradation-web
language: en
word: "graceful degradation"
part_of_speech: noun phrase
meaning: "优雅降级；在能力受限或部分功能失败时保留核心体验。"
example: "Graceful degradation keeps the core workflow available."
notes: |
  从完整体验出发，为缺少能力的环境设计可接受的替代路径。应明确核心操作、失败提示和功能边界。与渐进增强的主要区别是设计起点，不必把二者当作互斥策略。

