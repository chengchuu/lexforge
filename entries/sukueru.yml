id: sukueru
language: ja
word: "救える"
pronunciation: "すくえる"
part_of_speech: verb
meaning: "能够拯救"
context: "「救う」的可能形式，表示有能力或可能拯救。"
example: "私たちにも救える命があります。"
notes: |-
  救う的可能形式；与字典形「救う」分别学习。 学习来源: 《ウルトラマンレオ》。

  来源: 東京外国語大学言語モジュール: 可能形。https://www.coelang.tufs.ac.jp/mt/ja/gmod/courses/c01/lesson18/step3/card/074.html
word_formation: "救う → 救える。五段动词的词尾 う 在可能形中变为 える，表示能够救助。"
audio: sukueru.mp3
learning_priority: 2
prerequisites:
  - sukuu
tags:
  - verb
