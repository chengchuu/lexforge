id: "paella-cooking"
language: "en"
word: "paella"
pronunciation: "/pɑˈjɛlə/"
part_of_speech: "noun"
meaning: "西班牙海鲜饭或烩饭；以米饭配合肉类、海鲜或蔬菜烹制的料理。"
example: "The meal includes seafood paella."
notes: |-
  来源组合或标题: Seafood Paella。

  学习主题: The Legend of Zelda: Tears of the Kingdom。
  Source: Prompt/20261104-lexforge.md. Source form: Seafood Paella.

  Memory-aid source: Online Etymology Dictionary — paella. https://www.etymonline.com/word/paella
  Pronunciation source: Collins Dictionary — paella; paella in American English; Webster’s New World College Dictionary, 5th Digital Edition. https://www.collinsdictionary.com/dictionary/english/paella (accent: US; accessed 2026-11-18).

  配图来源：Kiranico《王国之泪》图鉴，展示海鲜烩饭（Seafood Paella）。https://zelda.kiranico.com/totk/data/food/Item_Cook_N_01
etymology: "来自加泰罗尼亚语 paella (烹饪锅)，菜名取自烹制它的锅具；不要仅凭名称认定配料必须全是海鲜。"
