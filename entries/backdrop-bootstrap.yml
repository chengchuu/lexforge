id: backdrop-bootstrap
language: en
word: "backdrop"
pronunciation: "/ˈbæk.drɑːp/"
part_of_speech: noun
meaning: "背景遮罩，覆盖在页面与对话框之间的背景层"
example: "The backdrop dims the page behind the modal."
code_example: |-
  <button type="button" class="btn btn-primary" data-bs-toggle="modal"
          data-bs-target="#details">Open static modal</button>
  <div class="modal fade" id="details" tabindex="-1" role="dialog"
       aria-labelledby="title" aria-hidden="true" data-bs-backdrop="static">
    <div class="modal-dialog"><div class="modal-content">
      <div class="modal-header"><h2 class="modal-title fs-5" id="title">Details</h2></div>
      <div class="modal-body">Your reservation is ready.</div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div></div>
  </div>
notes: |-
  Bootstrap 的 modal 和 offcanvas 可配置是否使用遮罩。

  Source: Bootstrap 5.3 documentation — modal. https://getbootstrap.com/docs/5.3/components/modal/

  Pronunciation source: Cambridge Dictionary — backdrop (US, accessed 2026-11-19). https://dictionary.cambridge.org/pronunciation/english/backdrop
learning_priority: 2
prerequisites:
  - modal-bootstrap
audio: backdrop-bootstrap.mp3
tags:
  - tech
  - frontend
