id: form-submission-html
language: en
word: "form submission"
part_of_speech: noun phrase
meaning: "表单提交，浏览器收集表单数据并按指定方式处理的过程"
example: "Form submission sends the selected values to the server."
code_example: |-
  <form>
    <label>Search <input name="query" value="trains" required></label>
    <button>Search</button>
  </form>
  <output></output>
  <script>
    document.querySelector('form').addEventListener('submit', event => {
      event.preventDefault();
      const fields = new FormData(event.currentTarget);
      document.querySelector('output').value = new URLSearchParams(fields).toString();
    });
  </script>
notes: |-
  Source: WHATWG HTML — Form control infrastructure. https://html.spec.whatwg.org/multipage/form-control-infrastructure.html
learning_priority: 2
prerequisites:
  - form-html
audio: form-submission-html.mp3
tags:
