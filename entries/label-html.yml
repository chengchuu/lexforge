id: label-html
language: en
word: "label"
pronunciation: "/ˈleɪ.bəl/"
part_of_speech: noun
meaning: "标签，与表单控件关联并说明其用途的可见文字或元素"
example: "Associate the label with the email input."
notes: |-
  可用 label 的 for 属性关联具有对应 id 的控件，也可把适用的控件放在 label 内。

  Source: W3C WAI — Labeling Controls. https://www.w3.org/WAI/tutorials/forms/labels/

  Pronunciation source: Cambridge Dictionary — label (US, accessed 2026-11-19). https://dictionary.cambridge.org/us/pronunciation/english/label
learning_priority: 2
prerequisites:
  - form-control-bootstrap
tags:
  - tech
  - frontend
  - html
  - noun
