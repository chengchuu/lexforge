id: fixed-positioning-css
language: en
word: "fixed positioning"
part_of_speech: noun phrase
meaning: "固定定位，使盒子脱离常规流并相对固定定位包含块定位，通常是视口"
example: "Fixed positioning keeps the button visible while the page scrolls."
notes: |-
  某些祖先元素可以建立固定定位包含块，例如设置非 none 的 transform 时。

  Source: MDN — CSS layout. https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/CSS_layout
learning_priority: 2
prerequisites:
  - absolute-positioning-css
tags:
  - tech
  - frontend
  - css
  - phrase
