id: relative-positioning-css
language: en
word: "relative positioning"
part_of_speech: noun phrase
meaning: "相对定位，保留在常规流中的位置，并可相对该位置偏移"
example: "Use relative positioning to move the label slightly without shifting other items."
code_example: |-
  <style>
    .sample { position: relative; left: 12px; margin: 0; }
    p { margin: 0; }
  </style>
  <p class="sample">Offset visually</p><p>Still occupies the first row</p>
