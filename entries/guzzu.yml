id: guzzu
language: ja
word: "グッズ"
pronunciation: "グッズ"
part_of_speech: noun
meaning: "周边；商品"
context: "常指商品或与作品、角色相关的周边用品。"
example: "新しいグッズを買いました。"
notes: "来源: 小学館《デジタル大辞泉》或《精選版 日本国語大辞典》: グッズ (コトバンク)。https://kotobank.jp/word/ぐつず-3210057"
etymology: "グッズ 借自英语 goods，表示商品、物品；日语也常用它指与人物或活动相关的周边。不要把它反向理解为英语 good (好的) 的日语复数变化。"
