id: "durability-equipment"
language: "en"
word: "durability"
pronunciation: "/dəɹəˈbɪləti/"
part_of_speech: "noun"
meaning: "耐用性；耐久度。"
example: "Durability decreases as the weapon is used."
notes: |-
  与 durable（耐用的）对应。游戏中常用于武器、盾等装备的耐久表现，不等同于角色的精力 stamina。

  学习主题: The Legend of Zelda: Tears of the Kingdom。
  Source: Prompt/20261104-lexforge.md. Source form: Durability.

  Pronunciation source: Wiktionary — durability; English Pronunciation, US. https://en.wiktionary.org/w/index.php?title=durability&oldid=94553680 (accent: US; accessed 2026-11-22).

  配图：AI 生成的原创助记图，用经得起使用的器材与已断裂的器材对比来记耐久度。
word_formation: "durable 是形容词，durability 是对应的抽象名词；-ble 结尾的形容词常有 -bility 形式的名词。"
