id: "pristine-general"
language: "en"
word: "pristine"
pronunciation: "/ˈprɪsˌtin/"
part_of_speech: "adjective"
meaning: "完好如初的；未受损或未被改变的。"
context: "本作武器语境中可用来区分未腐朽的武器与 decayed（腐朽的）武器。"
example: "I found a pristine sword."
notes: |-
  学习主题: The Legend of Zelda: Tears of the Kingdom。
