id: fuuin-kaijo-reriizu
language: ja
word: "封印解除（レリーズ）！"
pronunciation: "レリーズ"
part_of_speech: phrase
meaning: "封印解除（Release）！"
context: "所给《カードキャプターさくら》咒语，以作品读法「レリーズ」作为主要读音。"
example: "封印解除（レリーズ）！"
notes: "合并写法：封印解除、封印解除！、封印解除（レリーズ）！普通读法：ふういんかいじょ；作品中的主要读法：レリーズ。「レリーズ」表示 release（解除），此处仅学习作品咒语中的借词读法，不扩展到其他专业用法。「封印解除（レリーズ）」は、ここでは「レリーズ」と読みます。不同写法、读法及单独的「レリーズ」共用此卡片；「封印」「解除」仍各有独立学习条目。 来源作品: 《カードキャプターさくら》。"
word_formation: "封印 + 解除。普通汉字词组合读 ふういんかいじょ；当前咒语采用作品读法 レリーズ，不能从两个普通词的读音直接拼出这一作品读法。"
mnemonic: "这张卡按《カードキャプターさくら》的作品读法读 レリーズ；普通汉字词 封印解除 则读 ふういんかいじょ。看见相同汉字时先判断是否处于作品语境。"
