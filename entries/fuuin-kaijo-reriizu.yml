part_of_speech: phrase
meaning: "封印解除（Release）！"
context: "所给《カードキャプターさくら》咒语，以作品读法「レリーズ」作为主要读音。"
example: "封印解除（レリーズ）！"
notes: "合并写法：封印解除、封印解除！、封印解除（レリーズ）！普通读法：ふういんかいじょ；作品中的主要读法：レリーズ。普通形式表示「封印解除」，咒语形式保留 Release 的作品语境。不同写法和读法共用此卡片；「封印」「解除」「レリーズ」仍各有独立学习条目。"
