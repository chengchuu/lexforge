id: var-function-css
language: en
word: "var()"
part_of_speech: CSS syntax
meaning: "在 CSS 声明中代入自定义属性值的函数"
example: "Use var() to read the spacing custom property."
code_example: |-
  <style>
    .sample { --accent: teal; border: 2px solid var(--accent); }
  </style>
  <p class="sample">Sample</p>
