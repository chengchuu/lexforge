word: "nonthrowing"
pronunciation: /ˌnɑnˈθroʊɪŋ/
part_of_speech: adjective
meaning: "不会抛出异常的"
context: "执行时不产生需要异常处理器捕获的异常。"
example: "The optimizer incorrectly treats every array expression as nonthrowing."
notes: |-
