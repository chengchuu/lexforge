id: boku-wa-shinsekai-no-kami-ni-naru
language: ja
word: "僕は新世界の神になる"
pronunciation: "ぼくはしんせかいのかみになる"
part_of_speech: phrase
meaning: "我将成为新世界的神"
context: "保留所给作品短句中的强烈宣言语气，用于学习「〜になる」。"
example: "僕は新世界の神になる。"
notes: |-
  来源作品: 动画《DEATH NOTE》(デスノート)，相关角色为夜神月。
  本条保留学习记录提供的表达，用于学习「新世界」「神」和「〜になる」。
  官方剧情介绍可支持作品与角色的关联；尚未逐字核实本条写法，不标注集数或时间戳。
  来源: 日本电视台《DEATH NOTE》官方剧情介绍。https://www.ntv.co.jp/deathnote/static/story2.html

  来源: 東京外国語大学言語モジュール: NのN。https://www.coelang.tufs.ac.jp/mt/ja/gmod/courses/c01/lesson03/step1/card/008.html
word_formation: "僕 + は + 新世界 + の + 神 + に + なる。新世界の神 是\"新世界的神\"，に 标记成为的身份；整体是\"我要成为新世界的神\"。"
