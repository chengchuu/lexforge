id: braised-food
language: en
word: "braised"
part_of_speech: adjective
meaning: "炖的；焖制的"
context: "说明食物经过少量液体慢炖或焖煮，常用于肉类菜名。"
example: "Would you like braised beef with rice?"
notes: "常见搭配：braised beef（炖牛肉；焖牛肉）、braised chicken（炖鸡；焖鸡）。"
