id: margin-collapsing-css
language: en
word: "margin collapsing"
part_of_speech: noun phrase
meaning: "外边距折叠，符合条件的相邻块轴外边距合并为一个外边距"
example: "Margin collapsing explains the space between the two paragraphs."
code_example: |-
  <style>
    .sample p { margin: 0; }
    .sample p:first-child { margin-bottom: 24px; }
    .sample p + p { margin-top: 16px; }
  </style>
  <div class="sample"><p>First block</p><p>Second block</p></div>
notes: |-
  Source: W3C — CSS Box Model Module Level 4. https://www.w3.org/TR/css-box-4/
learning_priority: 2
prerequisites:
  - margin-css
  - normal-flow-css
audio: margin-collapsing-css.mp3
tags:
