id: no-ka-grammar
language: ja
word: "～のか"
pronunciation: "～のか"
part_of_speech: phrase
meaning: "疑问；根据语气可表示强烈反问"
context: "用于疑问、确认或反问，强度取决于语境和语气。"
example: "本当に行くのか。"
notes: |-
  学习来源: 《ウルトラマンレオ》。

  来源: 小学館《デジタル大辞泉》或《精選版 日本国語大辞典》: か (コトバンク)。https://kotobank.jp/word/か-456254
mnemonic: "のか 可以用来询问、确认，也能带反问语气；先看上下文和说话语气，不把每一个 のか 都记成强烈反问。"
audio: no-ka-grammar.mp3
learning_priority: 2
