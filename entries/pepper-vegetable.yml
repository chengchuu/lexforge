meaning: "辣椒；甜椒；这里不指胡椒粉。"
notes: |-
  与既有 pepper-food（胡椒、胡椒粉）区分。Spicy Pepper 是本作的材料名称，简体中文为暖暖草果；不直接断言其等同于某种现实辣椒品种。

