id: key-react
language: en
word: "key"
pronunciation: "/kiː/"
part_of_speech: noun
meaning: "列表项标识，在同级列表项之间帮助 React 匹配节点的稳定标识"
example: "Use the record ID as the key."
notes: |-
  key 应在同级项之间保持唯一且稳定。React 不把 key 当作普通 prop 传给子组件。

  Source: React docs — Quick Start. https://react.dev/learn

  Pronunciation source: Cambridge Dictionary — key (US, accessed 2026-11-19). https://dictionary.cambridge.org/pronunciation/english/key
learning_priority: 1
prerequisites:
  - list-rendering-react
tags:
  - tech
  - frontend
  - react
  - noun
