notes: "来源: 小学館《デジタル大辞泉》或《精選版 日本国語大辞典》: タオル (コトバンク)。https://kotobank.jp/word/たおる-3157938"
etymology: "タオル 借自英语 towel，指毛巾或毛巾织物。本项只记录日语的直接借入来源，不把相关欧洲语言中的远源混写成日语直接借自那些语言。"
