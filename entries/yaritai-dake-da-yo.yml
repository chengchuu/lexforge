id: yaritai-dake-da-yo
language: ja
word: "やりたいだけだよ"
pronunciation: "やりたいだけだよ"
part_of_speech: phrase
meaning: "只是想做而已"
context: "用愿望形式与「だけ」说明只是自己想做，语气随意。"
example: "自分でやりたいだけだよ。"
notes: "やる → やりたい（愿望形式）。所给来源语句：俺がやれることをやりたいだけだよ。 学习来源: 《ウルトラマンティガ》。"
